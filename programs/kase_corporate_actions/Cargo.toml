[package]
rust-version = "1.79"
name = "kase_corporate_actions"
version = "0.1.0"
description = "Solana Anchor Program for KASE Automated Corporate Actions (Coupon, Redemption, Governance)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kase_corporate_actions"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022"] }
solana-program = "1.18.26"
thiserror = "1.0"
