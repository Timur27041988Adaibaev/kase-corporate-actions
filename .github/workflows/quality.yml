name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: kase-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Python syntax
        run: python -m py_compile terminal/server.py
      - name: Check browser JavaScript syntax
        run: node --check terminal/app.js
      - name: Run server smoke tests
        run: python -m unittest discover -s tests -p 'test_server_*.py' -v
      - name: Check Anchor program Rust compilation
        run: cargo check --manifest-path programs/kase_corporate_actions/Cargo.toml
  anchor-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Anchor CLI
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/avm" install 0.31.1
          "$HOME/.cargo/bin/avm" use 0.31.1
      - name: Install compatible Solana CLI after Anchor setup
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$HOME/.cargo/bin:$PATH"
          solana --version
          anchor --version
      - name: Configure local Solana wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --force -o "$HOME/.config/solana/id.json"
          solana config set --url localhost
      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --global yarn@1.22.22
      - name: Build and run Anchor integration tests on local validator
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo --version
          solana --version
          anchor --version
          anchor test
