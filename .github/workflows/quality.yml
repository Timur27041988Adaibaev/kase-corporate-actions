name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: kase-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Python syntax
        run: python -m py_compile terminal/server.py
      - name: Check browser JavaScript syntax
        run: |
          node --check terminal/app.js
          node --check terminal/anchor-console.js
      - name: Run server smoke tests
        run: python -m unittest discover -s tests -p 'test_server_*.py' -v
      - name: Check Anchor program Rust compilation
        run: cargo check --manifest-path programs/kase_corporate_actions/Cargo.toml
  anchor-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust toolchain compatible with Anchor IDL generation
        run: |
          set -euo pipefail
          # Anchor 0.32.1 includes the updated IDL generation implementation.
          rustc --version
          cargo --version
      - name: Install pinned Anchor CLI release binary
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/coral-xyz/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu \
            --output "$HOME/.cargo/bin/anchor"
          chmod 0755 "$HOME/.cargo/bin/anchor"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          anchor --version | grep -F "0.32.1"
      - name: Install compatible Solana CLI
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)" </dev/null
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          test -x "$SOLANA_BIN/solana"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$SOLANA_BIN:$HOME/.cargo/bin:$PATH"
          solana --version
          anchor --version
          solana --version | grep -F "2.3.0"
          anchor --version | grep -F "0.32.1"
      - name: Configure local Solana wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --force -o "$HOME/.config/solana/id.json"
          solana config set --url localhost
      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --global yarn@1.22.22
      - name: Build and run Anchor integration tests on local validator
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          rustc --version
          cargo --version
          solana --version | grep -F "2.3.0"
          anchor --version | grep -F "0.32.1"
          # Solana 2.3's SBF toolchain uses Cargo 1.84, which cannot parse
          # zeroize_derive 1.5.0's edition2024 manifest. Resolve with the
          # host Cargo and pin the compatible transitive version in Cargo.lock.
          cargo update -p zeroize_derive --precise 1.4.3
          anchor test

      - name: Upload generated Anchor IDL for browser integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kase-corporate-actions-idl
          path: target/idl/kase_corporate_actions.json
          if-no-files-found: warn
          retention-days: 14
